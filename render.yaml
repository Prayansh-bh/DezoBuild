services:
  - type: web
    name: dezobuild-backend
    env: node
    rootDir: backend
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PLATFORM_ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
